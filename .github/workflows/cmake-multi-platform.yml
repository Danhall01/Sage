# CMake + Ninja workflow for C++20 modules on multiple platforms.
#
# Requirements for modules:
#   - CMake >= 3.28 (module support is stable from 3.28)
#   - Ninja >= 1.11 (needed for dyndep support)
#   - GCC >= 14, Clang >= 16 (with clang-scan-deps), or MSVC >= 19.34 (VS 2022 17.4+)
name: CMake (Ninja + C++ modules) on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.toolchain }} / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep going so feedback is delivered for all matrix combinations.
      fail-fast: false

      # Produces one job per toolchain (x one per build type):
      # 1. <Windows, MSVC, Ninja>
      # 2. <Linux, GCC 14, Ninja>
      # 3. <Linux, Clang 18, Ninja>
      #
      # To add Debug builds, use: build_type: [Release, Debug]
      matrix:
        toolchain: [msvc, gcc, clang]
        build_type: [Release]
        include:
          - toolchain: msvc
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - toolchain: gcc
            os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - toolchain: clang
            os: ubuntu-latest
            c_compiler: clang-18
            cpp_compiler: clang++-18

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # Installs a recent CMake *and* Ninja on every platform, so we don't depend
    # on whatever versions happen to ship with the runner image.
    - name: Set up CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: latest
        ninjaVersion: latest

    - name: Install GCC 14 (Linux)
      if: matrix.c_compiler == 'gcc-14'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14

    # clang-tools provides clang-scan-deps, which CMake requires to scan for module dependencies.
    - name: Install Clang 18 and clang-scan-deps (Linux)
      if: matrix.c_compiler == 'clang-18'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 clang-tools-18

    # Ninja needs cl.exe on PATH, which the Visual Studio generator would otherwise set up for us.
    - name: Set up MSVC developer environment (Windows)
      if: matrix.c_compiler == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      # Ninja is a single-config generator, so CMAKE_BUILD_TYPE is required.
      run: >
        cmake -G Ninja
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # No --config needed: Ninja is single-config.
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --output-on-failure
